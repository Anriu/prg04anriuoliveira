<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Favicon -->
    <link rel="shortcut icon"
          href="assests/icons/favicon.ico"
          type="image/x-icon">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet"
          href="assests/css/login.css">
</head>

<body>

    <main class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                <div class="login-container">

                    <h2 class="text-center fw-bold mb-4">
                        LOGIN
                    </h2>

                    <!--
                        O atributo action simula o redirecionamento
                        após a validação do lado do cliente.
                    -->
                    <form action="admin.html" method="GET">

                        <!-- E-mail -->
                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">
                                E-mail:
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                required
                                placeholder="Digite seu e-mail">

                        </div>


                        <!-- Senha -->
                        <div class="mb-3">

                            <label
                                for="senha"
                                class="form-label">
                                Senha:
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="senha"
                                name="senha"
                                required
                                placeholder="Digite sua senha">

                        </div>


                        <!-- Botão -->
                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Entrar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript do Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
